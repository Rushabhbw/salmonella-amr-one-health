# Lean environment (download assemblies, run AMRFinderPlus, Snakemake workflow).
# Create:  mamba env create -f envs/step4_amr.yml
# Python and AMRFinderPlus are pinned. Other tools are recorded in envs/salmonella-amr-tools.lock.yml after a tested install.
name: salmonella-amr-tools
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.12      # pinned: an unpinned python picked 3.15, which Snakemake's dependencies do not support yet
  - pandas
  - ncbi-amrfinderplus=4.2.7   # the version used for the local concordance run
  - ncbi-datasets-cli
  - seqkit
  - snakemake
  - graphviz
  - unzip
  - pytest
  - scipy
  - scikit-learn
  - matplotlib
